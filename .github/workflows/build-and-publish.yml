name: Build & Publish Fat Mod

on:
  push:
    branches: [main, master, develop, '*-patched', '*-patched-dev']
    tags: ['*']
  pull_request:
    branches: [main, master, develop, '*-patched-dev', '*-patched']
  workflow_dispatch:
    inputs:
      entcore_version:
        description: 'Version entcore (ex: 6.16.14-patched). Laissez vide pour utiliser la version du pom.xml.'
        required: false
        default: ''

# Un seul build par PR et par commit. Groupe calculé selon l'événement : pour une
# PR, `github.ref` (refs/pull/N/merge) est stable d'un rebase à l'autre, donc une
# nouvelle poussée annule le build devenu périmé ; sinon le SHA, pour que deux refs
# sur le même commit (branche puis tag) ne construisent qu'une fois.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  packages: write

jobs:
  frontend:
    name: Build Frontend (Gulp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build with Node 26 via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --user root \
            node:26-alpine \
            sh -c "npm install --legacy-peer-deps && node_modules/gulp/bin/gulp.js build"

      # IHM React de la vue poll-react.html (/poll/public/react/poll.js) : sous-projet Vite frontend/,
      # distinct du Gulp. Paquets privés @open-ent -> auth via OPENENT_PACKAGES_TOKEN (frontend/.npmrc).
      # Sans cette étape, le fat-mod ne contient pas le bundle et ?ui=react (défaut) est cassé (404).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10

      - name: Build frontend React (sous-projet Vite frontend/)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
        run: |
          # le Gulp (docker, root) a créé des fichiers root dans src/main/resources
          sudo chown -R "$(id -u):$(id -g)" src/main/resources
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm exec vitest run
          NODE_ENV=production pnpm exec vite build
          mkdir -p ../src/main/resources/public/react
          cp dist/poll.js ../src/main/resources/public/react/
          [ -d dist/assets ] && cp -r dist/assets ../src/main/resources/public/react/ || true

      - name: Verify build outputs
        run: |
          test -f src/main/resources/view/poll.html       || { echo "::error::view/poll.html missing"; exit 1; }
          test -f src/main/resources/view/poll-react.html || { echo "::error::view/poll-react.html missing"; exit 1; }
          test -f src/main/resources/public/react/poll.js || { echo "::error::public/react/poll.js missing"; exit 1; }

      - name: Upload frontend assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-assets
          path: src/main/resources/
          retention-days: 1

  backend:
    name: Build & Publish Fat Mod
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-assets
          path: src/main/resources/

      - name: Configure Maven
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
              <server>
                <id>pt-releases</id>
                <username>$NEXUS_USER</username>
                <password>$NEXUS_PASSWORD</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      # Les artefacts entcore `-patched` sont republiés À VERSION IDENTIQUE (convention du

      # fork : une branche `X.Y.Z-patched-dev`, un tag `X.Y.Z-patched` qu'on déplace). Or Maven

      # tient une version release pour immuable et ne la retélécharge jamais si elle est déjà

      # dans le dépôt local — le cache de `setup-java` sert alors un entcore périmé.

      - name: Purger entcore du cache Maven (versions -patched republiées)

        run: rm -rf ~/.m2/repository/org/entcore


      - name: Build fat JAR
        run: |
          ENTCORE_OPT=""
          if [ -n "$ENTCORE_VERSION" ]; then ENTCORE_OPT="-DentCoreVersion=$ENTCORE_VERSION"; fi
          mvn clean package -DskipTests -B -DbuildNumber=${GITHUB_SHA::8} -DscmBranch=${GITHUB_REF_NAME} $ENTCORE_OPT
        env:
          ENTCORE_VERSION: ${{ github.event.inputs.entcore_version }}

      # Depuis le JDK 23, javac n'exécute plus les processeurs d'annotations trouvés sur le
      # classpath : sans `-proc:full` (pom), le jar part sans securedaction/ ni routes/, et
      # chaque route sécurisée répond 404 — sans aucune erreur de build.
      - name: Verify annotation metadata
        run: |
          FAT_JAR=$(ls target/*-fat.jar | head -1)
          for d in securedaction routes; do
            unzip -Z1 "$FAT_JAR" | grep -q "^$d/" || { echo "::error::$d/ absent de $FAT_JAR"; exit 1; }
          done

      - name: Run tests
        if: github.event_name == 'pull_request'
        # profil `scala` d'app-parent désactivé : maven-scala-plugin 2.15.2 ne lit pas le
        # bytecode des JDK récents, et aucun module applicatif n'a de source Scala.
        run: mvn test -B -P '!scala'

      - name: Configure Maven for GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>pt-releases</id>
                <username>${{ secrets.NEXUS_USER }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish fat JAR to GitHub Packages
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          FAT_JAR=$(ls target/*-fat.jar 2>/dev/null | head -1)
          echo "Publishing ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat"
          if [ -z "${FAT_JAR}" ]; then
            echo "::error::Fat JAR not found at ${FAT_JAR}"
            ls -la target/*.jar 2>/dev/null || echo "No JARs found in target/"
            exit 1
          fi
          mvn deploy:deploy-file \
            -Dfile="${FAT_JAR}" \
            -DgroupId="${GROUP_ID}" \
            -DartifactId="${ARTIFACT_ID}" \
            -Dversion="${VERSION}" \
            -Dclassifier=fat \
            -Dpackaging=jar \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${{ github.repository }}" \
            -B

      - name: Publish fat JAR to rct-nexus
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          cat > /tmp/nx-settings.xml <<EOF
          <settings><servers><server><id>pt-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASSWORD}</password></server></servers></settings>
          EOF
          FAT_JAR=$(ls target/*-fat.jar 2>/dev/null | head -1)
          if [ -z "${FAT_JAR}" ]; then echo "::error::Fat JAR not found"; exit 1; fi
          FAT_ABS=$(realpath "${FAT_JAR}")
          BASE=$(basename "${FAT_JAR}" -fat.jar)
          GROUP_ID=${BASE%%~*}; REST=${BASE#*~}; ARTIFACT_ID=${REST%%~*}; VERSION=${REST#*~}
          echo "Deploying ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat -> rct-nexus"
          cd /tmp
          mvn deploy:deploy-file -s /tmp/nx-settings.xml -Dfile="${FAT_ABS}" -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=pt-releases -Durl="https://rct-nexus.tech.fr/repository/maven-releases/" -B

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: target/*-fat.jar
          generate_release_notes: true
